# Infrastructure pipeline. Nobody needs tools on their own computer:
#
#   pull request to main  -> check + tofu plan, plan posted on the PR
#   push to main (merge)  -> check + tofu plan, then tofu apply of that exact
#                            plan after a required reviewer approves the
#                            azure-production environment
#   Run workflow (manual) -> same as a push to main, e.g. after editing the
#                            firewall IPs in 1Password
#
# Secrets: the only GitHub secret is OP_SERVICE_ACCOUNT_TOKEN, stored per
# environment (azure-plan, azure-production). Everything else comes from
# 1Password through Varlock (.env.schema).
#
# Public repo: jobs never run for pull requests from forks (no secrets,
# no runners), and sensitive values are redacted in plan output.
# Setup: documentation/docs/guide/github-setup.md
name: Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # FlakeHub cache (setup-nix) authenticates with GitHub OIDC.
  id-token: write

jobs:
  check:
    # Same-repo branches only: forks never run this repo's CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: nix flake check (lint, lock sync, docs, offline tofu validate)
        run: nix flake check -L

  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    environment: azure-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: plan-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: tofu plan
        id: plan
        run: |
          set +e
          nix run .#sql-server.plan -- -input=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          # -detailed-exitcode: 0 no changes, 1 error, 2 changes
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Write plan summary
        run: |
          nix run .#tofu -- show -no-color tfplan > plan.txt
          {
            echo "## OpenTofu plan"
            echo
            echo "**$(grep -E '^(Plan:|No changes)' plan.txt | head -n 1 || echo 'See the log')**"
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            # A PR comment holds at most 65536 characters.
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
            echo
            echo "_Commit ${GITHUB_SHA::7} · [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
          } > plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file plan.md --edit-last --create-if-none

      # The plan file is encrypted (OpenTofu plan encryption, enforced), so it
      # is safe to keep as an artifact for the apply job.
      - name: Keep plan for apply
        if: github.event_name != 'pull_request' && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: tfplan
          path: .tofu/sql-server/tfplan
          retention-days: 1

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.changes == 'true'
    needs: plan
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the operator approval.
    environment: azure-production
    concurrency:
      group: apply
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Get the approved plan
        uses: actions/download-artifact@v5
        with:
          name: tfplan
          path: .tofu/sql-server

      # Applies exactly the plan that was reviewed. If Azure or the state
      # changed since, tofu refuses the stale plan: run the workflow again.
      - name: tofu apply
        run: nix run .#sql-server.apply -- -input=false -no-color tfplan
